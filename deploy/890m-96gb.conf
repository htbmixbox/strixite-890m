# Radeon 890M / gfx1150 on Linux, 96 GB of unified *physical* RAM.
# This profile is also the fork's built-in default where noted. Every value can be
# overridden: strix_server --config deploy/890m-96gb.conf --capacity 32768
# Values are STARTING POINTS, not a measured 890M throughput/memory benchmark.
# Preserve headroom for the OS and the ROCm/GTT allocations. 96 GB decimal = 89.4 GiB.
# The RTX 2070 can back OS swap or an external tier, but is NOT extra HIP memory.

model-id = qwen3.8-flash-next
host = 0.0.0.0
port = 5300

# KV/state allocation is proportional to capacity; smaller prefill chunks cut workspace.
capacity = 65536
rope-yarn-factor = 1
chunk = 2048

# Retain the model's speculative decoding path; turn off for diagnosis or more headroom.
mtp = on
mtp-draft = 7
mtp-margin = 2
mtp-vocab = 65536

# 2^18 rows: ~0.1 GiB instead of ~3 GiB of pageable CPU caching.
ngram-cache-rows = 262144

# Prompt states stay on disk and can use the OS's page-cache/swap facilities.
# Disk cap is NOT preallocated; filesystem must still have room as cache grows.
prompt-cache-gib = 128
prompt-cache-ram-margin-gib = 6
prompt-cache-idle-s = 600
prompt-cache-write-gib-per-hour = 0
prompt-cache-disk-free-gib = 32
prompt-cache-checkpoints = 3
prompt-cache-delta-max-tokens = 16384

# 'adapt' ONLY sheds host caches after successful GPU allocation; it cannot make
# the ~66 GiB of weights or GPU workspace pageable. 'fail' is safest on 96 GB.
low-memory = fail

think-nudge = on
think-end-guard = on
literal-tags = on
think-close-on-call = on
think-nudge-rate = 0.25
think-nudge-min-tokens = 3072
think-nudge-wording = commit
thinking = on
